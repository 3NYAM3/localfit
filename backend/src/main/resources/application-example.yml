spring:
  application:
    name: localfit

  datasource:
    url: jdbc:mysql://localhost:3306/localfit?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: your-db-username
    password: your-db-password
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  data:
    redis:
      host: localhost
      port: 6379

# JWT 설정
jwt:
  secret: your-jwt-secret-key-must-be-at-least-256-bits-long-for-hmac-sha
  access-token-validity-ms: 1800000      # 30분
  refresh-token-validity-ms: 604800000   # 7일

# 공공데이터포털 설정
public-data:
  # 공공데이터포털에서 발급받은 인증키 (모든 API 공통)
  service-key: your-public-data-service-key

  # 행정안전부_행정표준코드 법정동코드
  region-code:
    target-keywords: 서울특별시,인천광역시,경기도    # API 검색 키워드
    target-sido-codes: 11,28,41                    # 수집 대상 시도코드 (법정동코드 기준)

  # 국토교통부_아파트 전월세 실거래가
  rent-trade:
    months-to-collect: 6                           # 현재 월 기준 과거 N개월치 수집

  # 국가철도공단_전국도시철도역사정보표준데이터
  subway:
    data-file-path: data/subway_stations.xlsx      # 리소스 기준 경로

  # 건강보험심사평가원_병원정보서비스
  hospital:
    target-sido-codes: 110000,220000,310000        # HIRA 시도코드 (서울/인천/경기)
    target-cl-codes: 01,11,21                      # 종별코드 (상급종합/종합병원/병원)

# 로그 레벨
logging:
  level:
    com.localfit: info
    # HIRA 서버가 잘못된 형식의 쿠키를 응답해 발생하는 경고를 억제
    org.apache.hc.client5.http.protocol.ResponseProcessCookies: error