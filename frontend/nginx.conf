server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 라우팅 - 존재하지 않는 경로는 index.html로 넘겨 React Router가 처리하게 함
    location / {
        try_files $uri /index.html;
    }

    # 백엔드 API로 프록시 (Vite dev 서버의 프록시 설정을 프로덕션에서 대체)
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    location /internal/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }
}